project = "or_irr_test"
root = "/data/ssd1/swim"

[paths]
project_workspace = "{root}/{project}"
data = "{project_workspace}/data"
gis = "{data}/gis"
# 24 OWRD fields near Pendleton, OR (Umatilla / McKay Creek), supplied as
# examples/10_OR_Irrigation_Test/data/gis/or_irr_fields.fgb and written to the
# data volume as .shp + .fgb by prepare_fields.py.
fields_shapefile = "{gis}/or_irr_fields.shp"
properties = "{data}/properties"
lulc = "{properties}/{project}_landcover.csv"
properties_json = "{properties}/{project}_properties.json"
container = "{data}/{project}.swim"

# Remote sensing
remote_sensing = "{data}/remote_sensing"
landsat = "{remote_sensing}/landsat"

[paths.conus]
met = "{data}/meteorology/gridmet"
# Single GridMET cell (680670) for every field, written by prepare_fields.py;
# no centroid grid file is needed.
gridmet_mapping = "{gis}/or_irr_fields_gfid.shp"
# No `irr` entry on purpose: IrrMapper/LANID never enters this container.
ssurgo = "{properties}/{project}_ssurgo.csv"
snodas_in = "{data}/snow/snodas/extracts"

[earth_engine]
bucket = "wudr"

[ids]
feature_id = "OPENET_ID"

[ids.conus]
gridmet_join_id = "OPENET_ID"
gridmet_id = "GFID"
state_col = "state"

[data_sources]
met_source = "gridmet"
snow_source = "snodas"
soil_source = "ssurgo"
mask_mode = "none"

[misc]
irrigation_threshold = 0.3
elev_units = "m"
refet_type = "eto"
runoff_process = "cn"

[date_range]
start_date = "1995-01-01"
end_date = "2025-12-31"

[crop_coefficient]
kc_proxy = "etf"
cover_proxy = "ndvi"

[calibration]
pest_run_dir = "{project_workspace}/pestrun"
# Four LST-based OpenET v2.1 members; SIMS (NDVI-only) and PT-JPL (no LST)
# are excluded so the target carries the thermal stress signal.
etf_target_model = "ensemble"
ensemble_source = "computed"
etf_ensemble_members = ["ssebop", "eemetric", "geesebal", "disalexi"]
workers = 24
realizations = 200
calibration_dir = "{pest_run_dir}/pest/mult"
obs_folder = "{pest_run_dir}/obs"
initial_values_csv = "{pest_run_dir}/params.csv"
spinup = "{pest_run_dir}/spinup.json"
