project = "5_Flux_Ensemble"
root = "/data/ssd1/swim"

[paths]
project_workspace = "{root}/{project}"
data = "{project_workspace}/data"
gis = "{data}/gis"
# Filtered to Croplands classification (~60 stations)
# Create with: python setup_shapefile.py (filters from master at examples/gis/flux_stations.shp)
fields_shapefile = "{gis}/flux_fields.shp"
properties = "{data}/properties"
lulc = "{properties}/{project}_landcover.csv"
properties_json = "{properties}/{project}_properties.json"
container = "{data}/{project}.swim"

# Remote sensing
remote_sensing = "{data}/remote_sensing"
landsat = "{remote_sensing}/landsat"

[paths.conus]
met = "{data}/meteorology/gridmet"
gridmet_centroids = "{gis}/gridmet_centroids.shp"
gridmet_mapping = "{gis}/flux_fields_gfid.shp"
correction_tifs = "{data}/bias_correction_tif"
gridmet_factors = "{gis}/flux_fields_gfid.json"
irr = "{properties}/{project}_irr.csv"
ssurgo = "{properties}/{project}_ssurgo.csv"
snodas_in = "{data}/snow/snodas/extracts"

[earth_engine]
bucket = "wudr"

[ids]
feature_id = "site_id"

[ids.conus]
gridmet_join_id = "site_id"
gridmet_id = "GFID"  # Column name for GridMET cell ID in mapping shapefile
state_col = "state"

[data_sources]
met_source = "gridmet"
snow_source = "snodas"
soil_source = "ssurgo"
mask_mode = "none"

[misc]
irrigation_threshold = 0.3
elev_units = "m"
refet_type = "eto"
runoff_process = "cn"

[date_range]
start_date = "1995-01-01"
end_date = "2025-12-31"

[crop_coefficient]
kc_proxy = "etf"
cover_proxy = "ndvi"

[validation]
flux_dir = "{data}/daily_flux_files_2pt1"

[calibration]
pest_run_dir = "{project_workspace}/pestrun"
etf_target_model = "ensemble_mad"
ensemble_source = "computed"  # unused when etf_target_model = "ensemble_mad" (MAD ensemble pre-computed in container)
etf_ensemble_members = ["ssebop", "sims", "geesebal", "eemetric", "ptjpl", "disalexi"]
workers = 40
realizations = 200
calibration_dir = "{pest_run_dir}/pest/mult"
obs_folder = "{pest_run_dir}/obs"
initial_values_csv = "{pest_run_dir}/params.csv"
spinup = "{pest_run_dir}/spinup.json"
python_script = "{project_workspace}/custom_forward_run.py"
