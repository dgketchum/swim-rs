# Standard FAO-56 dual crop coefficient arm on the E0/E1 cohort.
#
# Matches the primary 5_Flux_Ensemble.toml except for three keys:
#
#   misc.kcb_ndvi_mode          = "linear"   Kcb = ndvi_beta*NDVI + ndvi_alpha
#   misc.transpiration_cover_mode = "none"   kc_act = Ks*Kcb + Ke (no fc weight)
#   calibration.pest_run_dir                 relocated so the shared pestrun/ is
#                                            never removed with the primary workspace
#
# Results tag: RunFAO56. The companion primary arm uses
# 5_Flux_Ensemble.toml.

project = "5_Flux_Ensemble"
root = "/data/ssd1/swim"

[paths]
project_workspace = "{root}/{project}"
data = "{project_workspace}/data"
gis = "{data}/gis"
# Filtered to Croplands classification (~60 stations)
# Created by container_prep.py:build_shapefile() (filters from shipped footprints + metadata)
fields_shapefile = "{gis}/flux_fields.shp"
properties = "{data}/properties"
lulc = "{properties}/{project}_landcover.csv"
properties_json = "{properties}/{project}_properties.json"
container = "{data}/{project}.swim"

# Remote sensing
remote_sensing = "{data}/remote_sensing"
landsat = "{remote_sensing}/landsat"

[paths.conus]
met = "{data}/meteorology/gridmet"
gridmet_centroids = "{gis}/gridmet_centroids.shp"
gridmet_mapping = "{gis}/flux_fields_gfid.shp"
# Reference ET is OpenET bias-corrected ETo/ETr (1999+), ingested by
# build_container.py; 1995-1998 spinup uses raw GridMET.
irr = "{properties}/{project}_irr.csv"
ssurgo = "{properties}/{project}_ssurgo.csv"
snodas_in = "{data}/snow/snodas/extracts"

[earth_engine]
bucket = "wudr"

[ids]
feature_id = "site_id"

[ids.conus]
gridmet_join_id = "site_id"
gridmet_id = "GFID"  # Column name for GridMET cell ID in mapping shapefile
state_col = "state"

[data_sources]
met_source = "gridmet"
snow_source = "snodas"
soil_source = "ssurgo"
mask_mode = "none"

[misc]
irrigation_threshold = 0.3
elev_units = "m"
refet_type = "eto"
runoff_process = "cn"
# --- Unscaled-linear physics: the substantive delta from the primary ---
# Standard FAO-56 dual crop coefficient with a linear Kcb-NDVI relation.
# Calibrates (ndvi_alpha, ndvi_beta) instead of (ndvi_k, ndvi_0) -- PestBuilder
# SWAPS the pair, so this arm carries the same COUNT of free curve parameters
# as the primary arm. Do NOT also set transpiration_cover_scaling: resolve_cover_mode()
# raises on a conflicting pair, and "none" already implies it False.
kcb_ndvi_mode = "linear"
transpiration_cover_mode = "none"

[date_range]
start_date = "1995-01-01"
end_date = "2025-12-31"

[crop_coefficient]
kc_proxy = "etf"
cover_proxy = "ndvi"

[validation]
flux_dir = "{data}/daily_flux_files_2pt1"

[calibration]
# Relocated from the shared "{project_workspace}/pestrun". calibrate.py rmtree's
# pest_run_dir unconditionally at startup; the shared one still holds unarchived
# leftovers. calibration_dir/obs_folder/initial_values_csv/spinup all interpolate
# from this key, so this one line isolates the whole working tree.
pest_run_dir = "{project_workspace}/pestrun_fao56"
# "ensemble" + "computed" is the paper E1 simple member-mean target.
etf_target_model = "ensemble"
ensemble_source = "computed"  # "computed" = DIY mean of members, "openet" = pre-computed OpenET ensemble
etf_ensemble_members = ["ssebop", "sims", "geesebal", "eemetric", "ptjpl", "disalexi"]
workers = 40
realizations = 200
calibration_dir = "{pest_run_dir}/pest/mult"
obs_folder = "{pest_run_dir}/obs"
initial_values_csv = "{pest_run_dir}/params.csv"
spinup = "{pest_run_dir}/spinup.json"
