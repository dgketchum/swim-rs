# fao56_sig — unscaled-sigmoid arm of the E0 vegetation-formulation study,
# calibrated natively on the Ex5 cohort (six-model ensemble target).
#
# Byte-identical to 5_Flux_Ensemble.toml (the Run 22 publication config) EXCEPT
# for two keys:
#
#   misc.transpiration_cover_mode = "none"   kc_act = Ks*Kcb + Ke (no fc weight);
#                                            Kcb stays the SIGMOID of NDVI, so this
#                                            arm differs from Run 22 ONLY in cover
#                                            scaling (isolated cover comparison)
#   calibration.pest_run_dir                 relocated so the shared pestrun/ is
#                                            never rmtree'd out from under Run 22
#
# NOT part of the development Run## series. Results tag: fao56_sig.
# Companion arms: results/run22 (cover-scaled sigmoid, "current") and
# results/RunFAO56 (unscaled linear, "fao56_std"). Together the three form the
# Ex5-native E0 trio, replacing the Ex4-container SSEBop-target study as the
# paper's primary Table 3 evidence.
# Precedent: examples/4_Flux_Network/notes/coverform_crops_results.md (fao56_sig arm)

project = "5_Flux_Ensemble"
root = "/data/ssd1/swim"

[paths]
project_workspace = "{root}/{project}"
data = "{project_workspace}/data"
gis = "{data}/gis"
# Filtered to Croplands classification (~60 stations)
# Created by container_prep.py:build_shapefile() (filters from shipped footprints + metadata)
fields_shapefile = "{gis}/flux_fields.shp"
properties = "{data}/properties"
lulc = "{properties}/{project}_landcover.csv"
properties_json = "{properties}/{project}_properties.json"
container = "{data}/{project}.swim"

# Remote sensing
remote_sensing = "{data}/remote_sensing"
landsat = "{remote_sensing}/landsat"

[paths.conus]
met = "{data}/meteorology/gridmet"
gridmet_centroids = "{gis}/gridmet_centroids.shp"
gridmet_mapping = "{gis}/flux_fields_gfid.shp"
# Legacy local GridMET bias-correction removed (see notes/handoff_single_refet.md).
# Reference ET is OpenET bias-corrected ETo/ETr (1999+), ingested by
# build_container.py; 1995-1998 spinup uses raw GridMET.
irr = "{properties}/{project}_irr.csv"
ssurgo = "{properties}/{project}_ssurgo.csv"
snodas_in = "{data}/snow/snodas/extracts"

[earth_engine]
bucket = "wudr"

[ids]
feature_id = "site_id"

[ids.conus]
gridmet_join_id = "site_id"
gridmet_id = "GFID"  # Column name for GridMET cell ID in mapping shapefile
state_col = "state"

[data_sources]
met_source = "gridmet"
snow_source = "snodas"
soil_source = "ssurgo"
mask_mode = "none"

[misc]
irrigation_threshold = 0.3
elev_units = "m"
refet_type = "eto"
runoff_process = "cn"
# --- fao56_sig physics: the only substantive delta from Run 22 ---
# Sigmoid Kcb-NDVI (default mode, same as Run 22) WITHOUT the fc cover weight:
# kc_act = Ks*Kcb + Ke. Calibrates the same (ndvi_k, ndvi_0) pair with the same
# priors (incl. the irrigation-informed ndvi_0), so the contrast vs Run 22 is
# cover scaling alone — no prior asymmetry. Do NOT set kcb_ndvi_mode (sigmoid
# is the default) and do NOT also set transpiration_cover_scaling:
# resolve_cover_mode() raises on a conflicting pair, and "none" already
# implies it False.
transpiration_cover_mode = "none"

[date_range]
start_date = "1995-01-01"
end_date = "2025-12-31"

[crop_coefficient]
kc_proxy = "etf"
cover_proxy = "ndvi"

[validation]
flux_dir = "{data}/daily_flux_files_2pt1"

[calibration]
# Relocated from the shared "{project_workspace}/pestrun". calibrate.py rmtree's
# pest_run_dir unconditionally at startup; the shared one still holds unarchived
# leftovers. calibration_dir/obs_folder/initial_values_csv/spinup all interpolate
# from this key, so this one line isolates the whole working tree.
pest_run_dir = "{project_workspace}/pestrun_fao56_sig"
# "ensemble" + "computed" = simple nanmean of members — the Run 21 publication target.
# The MAD sensitivity test (Run 21b) overrides to etf_target_model = "ensemble_mad"
# (dedicated path built by build_run21b_mad.py).
etf_target_model = "ensemble"
ensemble_source = "computed"  # "computed" = DIY mean of members, "openet" = pre-computed OpenET ensemble
etf_ensemble_members = ["ssebop", "sims", "geesebal", "eemetric", "ptjpl", "disalexi"]
workers = 40
realizations = 200
calibration_dir = "{pest_run_dir}/pest/mult"
obs_folder = "{pest_run_dir}/obs"
initial_values_csv = "{pest_run_dir}/params.csv"
spinup = "{pest_run_dir}/spinup.json"
