project = "8_Soil_Moisture"
root = "/data/ssd1/swim"

# WP-C4 SMAP surface-soil-moisture (SSM) objective variant of 8_Soil_Moisture.toml.
# Adds a third PEST observation group: the deseasonalized SMAP L3 Enhanced surface
# anomaly (satellite, 0-5 cm) vs the modeled FAO-56 surface-layer anomaly. The SSM
# TARGET is the SMAP satellite product only (ssm_data_path); in-situ SCAN theta stays
# validation-only and is never a calibration input.
#
# Differs from the canonical config only in:
#   (1) pest_run_dir -> pestrun_c4 (no canonical e8cal/e8c1 artifact is touched);
#   (2) ssm_calibration=true activates the SSM group (PestBuilder);
#   (3) scheduler_calibration_params activates the C1 scheduler-realism knobs so the
#       SSM residual has the levers (refill_frac/min_irr_days, plus mad/aw) to un-pin
#       the root zone -- this is C1+C4, the WP-A-routed configuration where the SSM
#       signal can actually break the no-stress-band equifinality. Drop line (3) for a
#       pure-C4 (baseline-scheduler) ablation.
# Launch against the e8c4 container copy via --container. See
# notes/wp_c4_implementation.md.

[paths]
project_workspace = "{root}/{project}"
data = "{project_workspace}/data"
gis = "{data}/gis"
fields_shapefile = "{gis}/scan_fields.shp"
properties = "{data}/properties"
lulc = "{properties}/{project}_landcover.csv"
properties_json = "{properties}/{project}_properties.json"
container = "{data}/{project}.swim"

# Remote sensing
remote_sensing = "{data}/remote_sensing"
landsat = "{remote_sensing}/landsat"

[paths.conus]
met = "{data}/meteorology/gridmet"
gridmet_centroids = "{gis}/gridmet_centroids.shp"
gridmet_mapping = "{gis}/scan_fields_gfid.shp"
irr = "{properties}/{project}_irr.csv"
ssurgo = "{properties}/{project}_ssurgo.csv"
snodas_in = "{data}/snow/snodas/extracts"

[earth_engine]
bucket = "wudr"

[ids]
feature_id = "site_id"

[ids.conus]
gridmet_join_id = "site_id"
gridmet_id = "GFID"
state_col = "state"

[data_sources]
met_source = "gridmet"
snow_source = "snodas"
soil_source = "ssurgo"
mask_mode = "none"

[misc]
irrigation_threshold = 0.3
elev_units = "m"
refet_type = "eto"
runoff_process = "cn"

[date_range]
start_date = "1995-01-01"
end_date = "2025-12-31"

[crop_coefficient]
kc_proxy = "etf"
cover_proxy = "ndvi"

[validation]
flux_dir = "{data}/daily_flux_files_2pt1"

[calibration]
pest_run_dir = "{project_workspace}/pestrun_c4"
etf_target_model = "ensemble"
ensemble_source = "computed"
etf_ensemble_members = ["ssebop", "sims", "geesebal", "eemetric", "ptjpl", "disalexi"]
# C1 scheduler-realism knobs (levers for the SSM term; see header note (3)).
scheduler_calibration_params = ["refill_frac", "min_irr_days"]
# WP-C4 SMAP SSM objective term.
ssm_calibration = true
ssm_data_path = "/home/dgketchum/code/swim-rs/examples/8_Soil_Moisture/notes/paper/data/smap_l3_scan.parquet"
ssm_value_col = "smap_l3_sm"
ssm_weighting_phi_share = 0.15   # SSM share of ETf information mass (matches SWE)
ssm_weighting_sd_floor = 0.03    # m3/m3 anomaly noise floor
ssm_min_seasons = 2              # require >= 2 growing-season years of SMAP capture
ssm_ze = 0.10                    # FAO-56 surface evaporation-layer depth (m)
ssm_gated_sites = ["Vallecitos"] # footprint-compromised 9 km pixel (feasibility probe)
workers = 20
realizations = 200
calibration_dir = "{pest_run_dir}/pest/mult"
obs_folder = "{pest_run_dir}/obs"
initial_values_csv = "{pest_run_dir}/params.csv"
spinup = "{pest_run_dir}/spinup.json"
