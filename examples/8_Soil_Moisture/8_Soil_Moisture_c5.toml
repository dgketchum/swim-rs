project = "8_Soil_Moisture"
root = "/data/ssd1/swim"

# WP-C5 = C4 (SMAP surface-soil-moisture objective) PLUS a free surface evaporation-
# layer capacity. Identical to 8_Soil_Moisture_c4.toml except ssm_surface_capacity=true
# re-enables REW/TEW as calibratable parameters (removed in 5f79a8c because ETf alone
# cannot identify them). The SMAP surface observation is the identifying constraint, and
# the localizer restricts REW/TEW to the SSM group so ETf residuals never drive them.
#
# This is the A/B that isolates what a physical surface-capacity lever buys: e8c4 (SMAP,
# no lever) vs e8c5 (SMAP + lever). Hypotheses: the SMAP surface signal sharpens the
# surface layer (higher surface-theta skill vs independent SCAN) instead of leaking into
# root-zone AWC, and the AWC railing relaxes. The SSM TARGET is the SMAP satellite
# product only (ssm_data_path); in-situ SCAN theta stays validation-only.
#
# Differs from c4 only in: pest_run_dir -> pestrun_c5, and ssm_surface_capacity=true.
# Launch against a fresh e8c5 container copy via --container (no e8c4 artifact touched).

[paths]
project_workspace = "{root}/{project}"
data = "{project_workspace}/data"
gis = "{data}/gis"
fields_shapefile = "{gis}/scan_fields.shp"
properties = "{data}/properties"
lulc = "{properties}/{project}_landcover.csv"
properties_json = "{properties}/{project}_properties.json"
container = "{data}/{project}.swim"

# Remote sensing
remote_sensing = "{data}/remote_sensing"
landsat = "{remote_sensing}/landsat"

[paths.conus]
met = "{data}/meteorology/gridmet"
gridmet_centroids = "{gis}/gridmet_centroids.shp"
gridmet_mapping = "{gis}/scan_fields_gfid.shp"
irr = "{properties}/{project}_irr.csv"
ssurgo = "{properties}/{project}_ssurgo.csv"
snodas_in = "{data}/snow/snodas/extracts"

[earth_engine]
bucket = "wudr"

[ids]
feature_id = "site_id"

[ids.conus]
gridmet_join_id = "site_id"
gridmet_id = "GFID"
state_col = "state"

[data_sources]
met_source = "gridmet"
snow_source = "snodas"
soil_source = "ssurgo"
mask_mode = "none"

[misc]
irrigation_threshold = 0.3
elev_units = "m"
refet_type = "eto"
runoff_process = "cn"

[date_range]
start_date = "1995-01-01"
end_date = "2025-12-31"

[crop_coefficient]
kc_proxy = "etf"
cover_proxy = "ndvi"

[validation]
flux_dir = "{data}/daily_flux_files_2pt1"

[calibration]
pest_run_dir = "{project_workspace}/pestrun_c5"
etf_target_model = "ensemble"
ensemble_source = "computed"
etf_ensemble_members = ["ssebop", "sims", "geesebal", "eemetric", "ptjpl", "disalexi"]
# C1 scheduler-realism knobs (levers for the SSM term).
scheduler_calibration_params = ["refill_frac", "min_irr_days"]
# WP-C4 SMAP SSM objective term.
ssm_calibration = true
ssm_data_path = "/home/dgketchum/code/swim-rs/examples/8_Soil_Moisture/notes/paper/data/smap_l3_scan.parquet"
ssm_value_col = "smap_l3_sm"
ssm_weighting_phi_share = 0.15   # SSM share of ETf information mass (matches SWE)
ssm_weighting_sd_floor = 0.03    # m3/m3 anomaly noise floor
ssm_min_seasons = 2              # require >= 2 growing-season years of SMAP capture
ssm_ze = 0.10                    # FAO-56 surface evaporation-layer depth (m)
ssm_gated_sites = ["Vallecitos"] # footprint-compromised 9 km pixel (feasibility probe)
# WP-C5: free REW/TEW as calibratable surface-capacity parameters (identified by SSM).
ssm_surface_capacity = true
workers = 20
realizations = 200
calibration_dir = "{pest_run_dir}/pest/mult"
obs_folder = "{pest_run_dir}/obs"
initial_values_csv = "{pest_run_dir}/params.csv"
spinup = "{pest_run_dir}/spinup.json"
